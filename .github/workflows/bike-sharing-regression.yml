name: Bike Sharing Downstream Regression Research

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/dataset_regression_experiment.py"
      - "backend/app/services/dataset_research.py"
      - "backend/app/services/dataset_bike_reference_experiment.py"
      - "backend/app/services/dataset_cleaning.py"
      - "backend/scripts/run_bike_sharing_regression_experiment.py"
      - "backend/tests/test_dataset_regression_experiment.py"
      - "backend/tests/test_dataset_research.py"
      - "backend/tests/test_dataset_bike_reference_experiment.py"
      - "backend/tests/test_dataset_cleaning.py"
      - ".github/workflows/bike-sharing-regression.yml"
  pull_request:
    paths:
      - "backend/app/services/dataset_regression_experiment.py"
      - "backend/app/services/dataset_research.py"
      - "backend/app/services/dataset_bike_reference_experiment.py"
      - "backend/app/services/dataset_cleaning.py"
      - "backend/scripts/run_bike_sharing_regression_experiment.py"
      - "backend/tests/test_dataset_regression_experiment.py"
      - "backend/tests/test_dataset_research.py"
      - "backend/tests/test_dataset_bike_reference_experiment.py"
      - "backend/tests/test_dataset_cleaning.py"
      - ".github/workflows/bike-sharing-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bike-sharing-regression:
    name: UCI Bike Sharing clean-test missingness, duplicate, invalid-value, and numerical-anomaly regression experiments
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run downstream regression experiments
        working-directory: backend
        run: >-
          python -m scripts.run_bike_sharing_regression_experiment
          --rates 0.01,0.05,0.10
          --corruption-types missingness,duplicates,invalid_values,numerical_anomalies
          --seeds 42,123,2026
          --test-size 0.25
          --alpha 1.0
          --output /tmp/uci-bike-sharing-regression.json
      - name: Upload reproducible regression report
        uses: actions/upload-artifact@v4
        with:
          name: uci-bike-sharing-regression
          path: /tmp/uci-bike-sharing-regression.json
          if-no-files-found: error
          retention-days: 30
