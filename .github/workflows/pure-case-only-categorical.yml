name: Pure Case-Only Categorical Research

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/dataset_research.py"
      - "backend/app/services/dataset_benchmark.py"
      - "backend/app/services/dataset_case_only_experiment.py"
      - "backend/app/services/dataset_quality.py"
      - "backend/app/services/dataset_bike_detector_experiment.py"
      - "backend/app/services/dataset_reference_experiment.py"
      - "backend/scripts/run_case_only_categorical_benchmark.py"
      - "backend/tests/test_dataset_research.py"
      - "backend/tests/test_dataset_benchmark.py"
      - "backend/tests/test_dataset_case_only_experiment.py"
      - ".github/workflows/pure-case-only-categorical.yml"
  pull_request:
    paths:
      - "backend/app/services/dataset_research.py"
      - "backend/app/services/dataset_benchmark.py"
      - "backend/app/services/dataset_case_only_experiment.py"
      - "backend/app/services/dataset_quality.py"
      - "backend/app/services/dataset_bike_detector_experiment.py"
      - "backend/app/services/dataset_reference_experiment.py"
      - "backend/scripts/run_case_only_categorical_benchmark.py"
      - "backend/tests/test_dataset_research.py"
      - "backend/tests/test_dataset_benchmark.py"
      - "backend/tests/test_dataset_case_only_experiment.py"
      - ".github/workflows/pure-case-only-categorical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-case-only:
    name: UCI Wine and Bike Sharing pure case-only benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run pure case-only reference experiments
        working-directory: backend
        run: >-
          python -m scripts.run_case_only_categorical_benchmark
          --rates 0.01,0.05,0.10
          --seeds 42,123,2026
          --output /tmp/pure-case-only-categorical.json
      - name: Upload reproducible case-only report
        uses: actions/upload-artifact@v4
        with:
          name: pure-case-only-categorical
          path: /tmp/pure-case-only-categorical.json
          if-no-files-found: error
          retention-days: 30
